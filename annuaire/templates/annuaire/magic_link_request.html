{% extends "annuaire/base.html" %}
{% load crispy_forms_filters %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>Connexion par email</h1>
        <p class="text-muted">
            Indiquez l'adresse email associée à votre compte, nous vous enverrons un
            lien pour vous connecter sans mot de passe.
        </p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Recevoir un lien de connexion</button>
        </form>
    </div>
</div>
{% endblock content %}
