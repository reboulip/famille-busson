name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Skip only the redundant case: a develop -> main release PR's head commit was
    # already fully tested by the push-to-develop run above (release-workflow's CI
    # check leans on that run rather than waiting for a new one). hotfix/* -> main
    # PRs have no push-trigger coverage of their own, so they still need this.
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (with test group)
        run: uv sync --group test

      - name: Run tests with coverage
        run: uv run --group test pytest

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.html
