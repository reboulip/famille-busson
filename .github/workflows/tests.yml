name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install dependencies (with dev and test groups)
        run: uv sync --group dev --group test

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty check
        run: uv run ty check --exit-zero-on-warning

      - name: Compile message catalogs
        run: uv run python manage.py compilemessages

      - name: Check message catalogs are up to date
        run: |
          uv run python manage.py makemessages --all --no-obsolete
          uv run python manage.py makemessages -d djangojs --all --no-obsolete
          git diff -I'^"POT-Creation-Date' --exit-code -- locale/

      - name: Check English locale is fully translated
        run: |
          for f in locale/en/LC_MESSAGES/django.po locale/en/LC_MESSAGES/djangojs.po; do
            stats=$(msgfmt --statistics "$f" -o /dev/null 2>&1)
            echo "$stats"
            if echo "$stats" | grep -qE "fuzzy translation|untranslated message"; then
              echo "::error::$f has untranslated or fuzzy messages -- 15.5 requires locale/en to be 100% complete."
              exit 1
            fi
          done

  test:
    # Skip only the redundant case: a develop -> main release PR's head commit was
    # already fully tested by the push-to-develop run above (the /release skill's CI
    # check leans on that run rather than waiting for a new one). hotfix/* -> main
    # PRs have no push-trigger coverage of their own, so they still need this.
    if: github.event_name != 'pull_request' || github.head_ref != 'develop'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install tesseract-ocr and gettext
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra gettext

      - name: Install dependencies (with test group)
        run: uv sync --group test

      - name: Compile message catalogs
        run: uv run python manage.py compilemessages

      - name: Run tests with coverage
        run: uv run --group test pytest

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.html
