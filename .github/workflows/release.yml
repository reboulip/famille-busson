name: Release

# Tags v<version> from pyproject.toml and creates a GitHub Release whenever a version
# bump lands on main (see CLAUDE.md's Releases section and the /release skill, which
# bumps pyproject.toml's version as part of every develop -> main / hotfix PR). No
# package is built or published -- this is a continuously-deployed web app, so the
# tag + release exist purely to mark what shipped. It also closes each GH issue shipped
# in the new commit range, with a French permalink comment -- doing this here (rather
# than in a skill) means it happens regardless of which process or human pushed the
# version bump to main.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check whether pyproject.toml's version is already tagged
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and create the GitHub Release
        if: steps.version.outputs.already_tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="v${{ steps.version.outputs.version }}"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes

      - name: Close issues shipped in this release
        if: steps.version.outputs.already_tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="v${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -vFx "$VERSION" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found; nothing to diff, skipping issue closing."
            exit 0
          fi
          echo "Closing issues shipped in ${PREV_TAG}..${VERSION}"

          # Only feat:/fix: commits represent shipped issue work (per CLAUDE.md's
          # Branch Model). docs:/chore:/etc. commits (e.g. roadmap-triage commits) may
          # reference an issue number without actually shipping it, and must NOT
          # trigger a close -- gated on the subject-line prefix below.
          #
          # Issue refs "(#N)" are looked for on EVERY logical line of the full commit
          # message (subject + body), not just an end-anchored match on the subject.
          # This covers two conventions: a single-item commit "<type>: <summary> (#N)"
          # (ref on the subject line itself) *and* a dev-pipeline wave commit, whose
          # subject is a theme summary with no ref at all -- refs there live one per
          # body bullet, e.g. "- 2.4 -- ... (#64)". Missing the second form silently
          # under-closes every wave-based sprint release.
          #
          # A "logical line" first joins each bullet's wrapped continuation lines
          # (indented, not starting a new "- " item) back into one line, so a ref that
          # lands on a bullet's last physical line still carries its full description
          # in the issue comment below, not just the trailing fragment.
          declare -A issue_commits
          while IFS= read -r sha; do
            subject=$(git show -s --format='%s' "$sha")
            case "$subject" in
              "feat: "*|"fix: "*) ;;
              *) continue ;;
            esac
            body=$(git show -s --format='%b' "$sha")
            full="$subject"
            [ -n "$body" ] && full="${full}"$'\n'"${body}"
            joined=$(echo "$full" | awk '
              /^- / { if (para != "") print para; para = $0; next }
              /^  / && para != "" { line = $0; sub(/^  +/, "", line); para = para " " line; next }
              { if (para != "") { print para; para = "" }; print }
              END { if (para != "") print para }
            ')
            while IFS= read -r msg_line; do
              refs=$(echo "$msg_line" | grep -oE '\(#[0-9]+(, *#[0-9]+)*\)' | tr -dc '0-9, ')
              [ -z "$refs" ] && continue
              trimmed_line=$(echo "$msg_line" | sed -E 's/^[[:space:]-]*//')
              for n in ${refs//,/ }; do
                issue_commits["$n"]+="${sha} ${trimmed_line}"$'\n'
              done
            done <<< "$joined"
          done < <(git log "${PREV_TAG}..${VERSION}" --no-merges --format='%H')

          for issue in "${!issue_commits[@]}"; do
            state=$(gh issue view "$issue" --json state -q .state 2>/dev/null || echo "MISSING")
            if [ "$state" != "OPEN" ]; then
              echo "Issue #$issue is not open (state=$state), skipping."
              continue
            fi
            body_file=$(mktemp)
            {
              while IFS= read -r commit_line; do
                [ -z "$commit_line" ] && continue
                sha="${commit_line%% *}"
                subject="${commit_line#* }"
                short_sha="${sha:0:7}"
                echo "Livré sur \`main\` en [${short_sha}](https://github.com/${GITHUB_REPOSITORY}/commit/${sha}) — \`${subject}\`."
                echo
              done <<< "${issue_commits[$issue]}"
              echo "*Message généré automatiquement par la GitHub Action de release.*"
            } > "$body_file"
            gh issue comment "$issue" --body-file "$body_file"
            gh issue close "$issue" --reason completed
            rm -f "$body_file"
          done
