[project]
name = "famille-busson"
version = "0.2.7"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref>=3.11.1",
    "certifi>=2026.1.4",
    "cffi>=2.0.0",
    "charset-normalizer>=3.4.4",
    "crispy-bootstrap5>=2026.3",
    "cryptography>=46.0.5",
    "dj-rest-auth>=7.0.1",
    "django>=5.1.6",
    "django-allauth>=65.4.1",
    "django-crispy-forms>=2.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.16.1",
    "gunicorn>=26.0.0",
    "idna>=3.11",
    "jwt>=1.3.1",
    "pillow>=11.1.0",
    "psycopg[binary]>=3.3.4",
    "pycparser>=3.0",
    "requests>=2.32.3",
    "sqlparse>=0.5.5",
    "tzdata>=2025.3",
    "urllib3>=2.6.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
test = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-html>=4.1",
    "coverage[toml]>=7.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "famille_busson.settings"
pythonpath = ["."]
testpaths = ["annuaire/tests", "publications/tests"]
addopts = "-v --tb=short --cov=annuaire --cov=publications --cov-report=term-missing --cov-fail-under=80 --html=test-report.html --self-contained-html"

[tool.coverage.run]
source = ["annuaire", "publications"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py313"
line-length = 119
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    # null=True on string fields is pervasive in the existing schema; fixing it
    # means a data migration (NULL -> ''), which is a deliberate follow-up, not
    # a lint autofix.
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# pytest fixture re-export idiom: importing a fixture by name so pytest picks
# it up, then shadowing that name as a parameter in another fixture, looks
# like a redefinition to pyflakes but is the documented cross-conftest pattern.
"**/conftest.py" = ["F811"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# Django's descriptor-based fields (Manager, FieldFile, IntegerField/BooleanField
# instance access, etc.) don't match their declared class-level types without
# django-stubs, which ty does not yet support -- these rules would otherwise be
# near-100% false positives on any Django model/view.
unresolved-attribute = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"
no-matching-overload = "warn"
