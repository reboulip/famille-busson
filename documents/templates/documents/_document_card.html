<article class="document-card">
    <h3>{{ document.title }}</h3>
    <p class="document-card-meta">
        <a href="{% url 'category-detail' document.category.pk %}">{{ document.category.name }}</a>
        {% if document.document_date %} — {{ document.document_date|date:"j F Y" }}{% endif %}
    </p>
    {% if document.description %}<p>{{ document.description|truncatechars:200 }}</p>{% endif %}
    {# TODO: link to document-detail once item 4.1 lands #}
</article>
