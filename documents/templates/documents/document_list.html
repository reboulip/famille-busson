{% extends "annuaire/base.html" %}
{% load static %}
{% block content %}
    <div class="page-header">
        <h1>Documents</h1>
        <a href="{% url 'document-create' %}{% if selected_category %}?category={{ selected_category }}{% endif %}"
           class="btn btn-outline-primary" data-live-filter-carry="category">+ Ajouter un document</a>
    </div>
    <form method="get" action="{% url 'document-list' %}" class="search-form mb-3" id="document-filter-form"
          data-live-filter="#document-results" autocomplete="off">
        <input type="text" name="q" value="{{ query }}" placeholder="Rechercher…" class="search-input" aria-label="Rechercher un document">
        <select name="category" aria-label="Filtrer par catégorie">
            <option value="">Toutes les catégories</option>
            {% for cat in filter_categories %}
                <option value="{{ cat.pk }}" {% if selected_category == cat.pk|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
        <a href="{% url 'document-list' %}" class="btn btn-outline-secondary" data-live-filter-reset
           {% if not query and not selected_category %}hidden{% endif %}>Effacer</a>
    </form>
    <div id="document-results" aria-live="polite">
        {% include "documents/_document_results.html" %}
    </div>
{% endblock content %}
{% block extra_js %}
    <script src="{% static 'js/live_filter.js' %}"></script>
{% endblock extra_js %}
