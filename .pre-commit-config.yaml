repos:
  - repo: local
    hooks:
      # Local (uv run) rather than pinned to an external revision of astral-sh's own
      # ruff pre-commit hooks, so this always runs the exact ruff version uv.lock
      # pins -- the same one CI and the weekly dependency-upgrade workflow use. A
      # pinned external revision can drift from uv.lock after a dependency bump,
      # which reformats the same code back and forth between local commits and CI.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

      - id: ty
        name: ty (type check)
        entry: uv run ty check --exit-zero-on-warning
        language: system
        types: [python]
        pass_filenames: false

      - id: generate-data-model-docs
        name: Regenerate docs/data_model.md
        description: >
          Keeps docs/data_model.md in sync with annuaire/models.py and
          publications/models.py. If this hook modifies the file, review the
          diff, `git add docs/data_model.md`, and commit again.
        entry: uv run python manage.py generate_data_model_docs
        language: system
        files: ^(annuaire|publications|documents|photos|genealogy)/models\.py$
        pass_filenames: false
