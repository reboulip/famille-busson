repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check --exit-zero-on-warning
        language: system
        types: [python]
        pass_filenames: false

      - id: generate-data-model-docs
        name: Regenerate docs/data_model.md
        description: >
          Keeps docs/data_model.md in sync with annuaire/models.py and
          publications/models.py. If this hook modifies the file, review the
          diff, `git add docs/data_model.md`, and commit again.
        entry: uv run python manage.py generate_data_model_docs
        language: system
        files: ^(annuaire|publications)/models\.py$
        pass_filenames: false
